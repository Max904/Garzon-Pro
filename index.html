<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Garzón Pro · Menú Cocina 2</title>
<style>
:root{--bg:#faf6f1;--fg:#2a1f1a;--mut:#7a6a60;--card:#fff;--bd:#e4d9cf;--ac:#8b2e3c;--ok:#2e7d4f;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1613;--fg:#f3e9df;--mut:#b3a398;--card:#2a211c;--bd:#43372f;--ac:#e07a8a;--ok:#5fc08a;--no:#ff7b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1613;--fg:#f3e9df;--mut:#b3a398;--card:#2a211c;--bd:#43372f;--ac:#e07a8a;--ok:#5fc08a;--no:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{margin:.2em 0}h2{margin:.4em 0}.m{color:var(--mut);margin:.3em 0 1em}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;gap:8px}
.c,.s,.o,.b{display:block;width:100%;text-align:left;padding:12px 14px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.c span{display:block;color:var(--mut);font-size:.85em}
.b{width:auto;display:inline-block;margin:6px 6px 6px 0}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
ol{padding-left:0;list-style:none;counter-reset:n}
li{counter-increment:n;padding:10px 12px;margin:5px 0;border-radius:10px;background:var(--card);border:1px solid var(--ok)}
li:before{content:counter(n)". ";font-weight:700;color:var(--ok)}
.bad{border-color:var(--no);animation:sk .4s}.hint{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.tag{font-size:.8em;color:var(--mut)}.big{font-size:2.4em;font-weight:800;margin:.2em 0}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><div id="app"></div><script>
const R=[
{n:"Sopaipilla suflada con pebre",s:["Cocer el zapallo camote hasta que esté blando","Mezclar secos e incorporar la manteca de cerdo","Agregar zapallo y agua de cocción hasta masa homogénea","Porcionar y freír a 180 °C hasta que se inflen","Pebre: brunoise fina de tomate, cebolla y ají verde; chiffonade de cilantro; brunoise de ajo","Condimentar con sal, jugo de limón y aceite de oliva","Servir las sopaipillas con el pebre"],
q:[["¿A qué temperatura se fríen las sopaipillas?","180 °C",["160 °C","200 °C","150 °C"]],["¿Qué corte se usa para tomate, cebolla y ají verde del pebre?","Brunoise fina",["Juliana","Parmentier","Chiffonade"]],["¿Cómo se corta el cilantro del pebre?","Chiffonade",["Brunoise","Juliana","Dados"]],["¿Qué grasa se agrega a los secos de la masa?","Manteca de cerdo",["Mantequilla","Aceite de oliva","Margarina"]],["¿Con qué líquido se ajusta la masa?","Agua de cocción del zapallo",["Agua fría","Leche","Caldo de verduras"]],["¿Con qué se condimenta el pebre?","Sal, jugo de limón y aceite de oliva",["Vinagre y merkén","Sal y vinagre de vino","Limón y mantequilla"]]]},
{n:"Churrasca con ajo negro y merkén",s:["Activar la levadura fresca","Mezclar harina, sal, manteca y levadura","Agregar agua y amasar hasta masa homogénea","Dejar reposar la masa","Formar y cocinar en sartén con poco aceite, controlando la temperatura","Mantequilla: ablandar, machacar ajo negro e incorporar con el merkén","Refrigerar y servir las churrascas en canasto con la mantequilla"],
q:[["¿Qué lleva la mantequilla saborizada?","Ajo negro y merkén",["Ajo fresco y ají de color","Ajo negro y cilantro","Merkén y limón"]],["¿Cómo se cocinan las churrascas?","En sartén con poco aceite, controlando la temperatura",["Horneadas a 180 °C","Fritas en abundante aceite","A la plancha sin aceite"]],["¿Qué levadura se activa?","Levadura fresca",["Levadura seca","Polvos de hornear","Bicarbonato"]],["¿En qué se sirven las churrascas?","En un canasto",["En tabla de madera","En plato hondo","En fuente de greda"]],["¿Qué grasa lleva la masa?","Manteca",["Aceite de oliva","Mantequilla","Crema"]]]},
{n:"Sopa de machas",s:["Limpiar y desinfectar las machas; retirar las lenguas","Sudar cebolla en parmentier con mantequilla y tomillo","Desglasar con vino blanco","Cocinar las machas hasta que estén rosadas y retirarlas","Agregar papas y agua hasta que estén blandas","Licuar hasta textura homogénea","Incorporar la crema y calentar","Servir con machas, queso para gratinar y cilantro"],
q:[["¿Qué corte se hace a la cebolla?","Parmentier",["Brunoise","Juliana","Chiffonade"]],["¿Con qué se desglasa?","Vino blanco",["Vino tinto","Pisco","Caldo"]],["¿Hasta cuándo se cocinan las machas?","Hasta que estén rosadas",["Hasta que estén doradas","Hasta que estén blandas","Hasta que se oscurezcan"]],["¿Por qué se retiran las machas tras cocinarlas?","Para evitar que se sobrecuezan",["Para limpiarlas","Para desglasar","Para licuarlas"]],["¿Qué se hace con las papas y el agua?","Cocinar hasta blandas y licuar",["Freír y servir","Dorar y gratinar","Hervir y colar"]],["¿Cómo se termina el plato?","Machas, queso para gratinar y cilantro",["Machas, crema batida y perejil","Machas, merkén y limón","Solo machas y cilantro"]]]},
{n:"Ensalada mix de lechugas y cochayuyo crocante",s:["Cocer las habas en agua con sal, tiernas pero firmes","Baño frío para detener la cocción y conservar el verde","Hidratar cochayuyo, cortar en dados y mezclar con mantequilla y ajo","Hornear a 180 °C hasta crujiente; enfriar en rejilla","Cebolla en juliana fina; preparar las lechugas","Limoneta: limón, sal, pimienta, aceite, mostaza y miel","Huevo sous vide a 65 °C y baño frío","Montar y servir inmediatamente"],
q:[["¿A qué temperatura se cocina el huevo sous vide?","65 °C",["58 °C","72 °C","85 °C"]],["¿Por qué se pasan las habas a baño frío?","Detener la cocción y conservar el verde",["Quitarles la piel","Para servirlas frías","Hacerlas más crocantes"]],["¿Cómo se corta el cochayuyo?","En dados",["En juliana","En brunoise","En láminas"]],["¿A qué temperatura se hornea el cochayuyo?","180 °C",["120 °C","160 °C","220 °C"]],["¿Cómo se corta la cebolla?","Juliana fina",["Brunoise","Parmentier","Dados"]],["¿Qué lleva la limoneta además de limón, sal, pimienta y aceite?","Mostaza y miel",["Ajo y vinagre","Mostaza y azúcar","Miel y cilantro"]]]},
{n:"Secano costero",s:["Freír los garbanzos hasta que queden crocantes","Sofreír cebolla y ajo (brunoise fina); agregar ají de color y garbanzos","Cremoso de mote: sofrito dorado, agregar el mote","Agregar agua poco a poco, como un risotto","Espesar con chuño disuelto en agua","Reducir el luche hidratado en agua","Saltear champiñones en láminas a fuego alto; sumar luche y ají cacho de cabra ahumado","Montar: cremoso, pino de garbanzos y champiñones; brotes y merkén"],
q:[["¿Qué espesa el cremoso de mote?","Chuño disuelto en agua",["Maicena","Crema","Harina tostada"]],["¿Cómo se agrega el agua al mote?","Poco a poco, como un risotto",["Toda de una vez","Hirviendo y licuando","A baño María"]],["¿Qué aporta el luche reducido?","Sabor a mar",["Textura crocante","Color rojo","Dulzor"]],["¿Qué ají lleva el champiñón?","Cacho de cabra ahumado",["Ají de color","Ají verde","Merkén"]],["¿Cómo se cortan y saltean los champiñones?","Láminas grandes, fuego alto",["Brunoise, fuego bajo","Enteros, al horno","Dados, fuego medio"]],["¿Con qué se decora el plato?","Brotes y merkén",["Cilantro y limón","Queso y brotes","Merkén y crema"]]]},
{n:"Ravioli criollo en reducción tostada",s:["Masa: corona de harina con huevos, aceite de oliva y sal; reposar","Estirar fino y cortar las láminas","Relleno: zanahoria asada, queso chanco y merkén","Rellenar, sacar el aire, sellar bordes y cortar","Carne mechada: sellar, sofreír verduras, desglasar con vino tinto y cocer a fuego bajo","Deshilachar la carne y colar el líquido de cocción","Roux café oscuro + líquido de cocción y vino tinto: salsa napante","Blanquear cebollas perla y saltear con mantequilla y azúcar","Cocer raviolis; servir sobre la salsa con carne y cebollas"],
q:[["¿Qué lleva el relleno?","Zanahoria asada, queso chanco y merkén",["Carne mechada y queso","Zanahoria, mantecoso y ají","Zapallo, chanco y merkén"]],["¿De qué color debe ser el roux?","Café oscuro, sin quemar",["Rubio claro","Blanco","Negro"]],["¿Con qué se desglasa la carne?","Vino tinto",["Vino blanco","Agua","Pisco"]],["¿Cómo se sirve?","Salsa de base, raviolis, carne mechada y cebollas perla",["Raviolis bañados en salsa y queso","Carne de base y raviolis encima","Raviolis sin salsa y cebollas"]],["¿Cómo se preparan las cebollas perla?","Blanquear y saltear con mantequilla y azúcar",["Hornear con vino","Freír directo","Hervir con crema"]],["¿Cómo se forma la masa?","Corona de harina con huevos, aceite de oliva y sal",["Harina, agua y manteca","Harina y levadura","Harina, huevos y leche"]]]},
{n:"Camote & Mar",s:["Cocer papas y camote; procesar a puré con mantequilla","Preparar el ají verde encurtido","Preparar la ensalada a la chilena caliente","Alioli de ajo negro: machacar e incorporar a la base","Porcionar, secar y condimentar la reineta","Pasar la reineta por chuño y freír hasta dorar","Montar: puré, reineta, ají encurtido, ensalada y alioli"],
q:[["¿Qué pescado lleva?","Reineta",["Congrio","Merluza","Salmón"]],["¿Con qué se pasa la reineta antes de freír?","Chuño",["Harina de trigo","Pan rallado","Maicena"]],["¿Qué lleva el alioli?","Ajo negro machacado",["Ajo frito","Merkén","Ají verde"]],["¿Qué lleva el puré base?","Papas, camote y mantequilla",["Solo papas","Zapallo y crema","Papas y queso"]],["¿Cómo es la ensalada a la chilena?","Caliente",["Fría","Encurtida","Crocante"]],["¿Cómo se prepara el ají verde?","Encurtido",["Frito","Asado","Crudo"]]]},
{n:"Sinfonía Púrpura",s:["Mousse: reducir el jugo de cocción de betarraga con azúcar","Derretir chocolate amargo a baño María e incorporar la reducción","Sumar gelatina disuelta en leche tibia","Integrar crema semibatida con azúcar flor","Moldes de silicona y abatidor hasta que esté firme","Salsa: jugo de naranja, azúcar y maicena disuelta","Merengue suizo: claras y azúcar a baño María; batir firme","Colorante fucsia, manga y hornear a temperatura baja"],
q:[["¿Qué chocolate lleva la mousse?","Amargo, derretido a baño María",["Con leche","Blanco","Semiamargo al microondas"]],["¿En qué se disuelve la gelatina?","En leche tibia",["En agua fría","En crema","En jugo de betarraga"]],["¿Qué espesa la salsa de naranja?","Maicena",["Gelatina","Chuño","Harina"]],["¿Cómo se hace el merengue suizo?","Claras y azúcar a baño María, luego batir",["Claras batidas con almíbar","Claras al horno","Claras y azúcar flor en frío"]],["¿Qué colorante lleva el merengue?","Fucsia",["Rojo","Violeta","Rosado pastel"]],["¿Dónde se deja firme la mousse?","En moldes de silicona, en el abatidor",["En copas, al refrigerador","En molde metálico, al horno","En manga pastelera"]],["¿Cómo se hornea el merengue?","A temperatura baja hasta secar",["A 180 °C por 10 min","A fuego alto","No se hornea"]]]},
{n:"Poéticos e intrigantes",s:["Cocer las peras peladas en vino tinto, azúcar, naranja, canela y anís estrellado","Retirar las peras y emulsionar mantequilla en la salsa","Crumble: harina, mantequilla, azúcar rubia y canela hasta textura arenosa","Refrigerar, hornear a 180 °C y romper como tierra","Helado: infusionar leche y crema con canela entera","Agregar los secos y pasteurizar a 85 °C","Enfriar a 4 °C, madurar y mantecar","Montar: pera, salsa de vino, helado, crumble y brotes"],
q:[["¿A qué temperatura se pasteuriza la base del helado?","85 °C",["65 °C","72 °C","95 °C"]],["¿A qué temperatura se enfría la base?","4 °C",["10 °C","0 °C","-5 °C"]],["¿A qué temperatura se hornea el crumble?","180 °C",["150 °C","200 °C","160 °C"]],["¿Qué especias lleva la cocción de las peras?","Canela y anís estrellado",["Clavo y nuez moscada","Canela y vainilla","Anís y cardamomo"]],["¿Qué azúcar lleva el crumble?","Rubia",["Flor","Blanca","Mascabo"]],["¿Cuál es el orden del montaje?","Pera, salsa de vino, helado, crumble y brotes",["Crumble, pera, helado, salsa","Salsa, pera, crumble, helado","Helado, pera, brotes, salsa"]],["¿Qué textura tiene el crumble antes de hornear?","Arenosa, como migas de galleta",["Pastosa","Líquida","Elástica"]]]}];
const A=document.getElementById('app'),sh=a=>[...a].sort(()=>Math.random()-.5);
let P={},mode='o',S={};try{P=JSON.parse(localStorage.getItem('gz')||'{}')}catch(e){}
const put=(k,v)=>{P[k]=Math.max(P[k]||0,v);try{localStorage.setItem('gz',JSON.stringify(P))}catch(e){}};
const st=k=>P[k]==null?'Sin intentar':P[k]>=100?'⭐ Dominada (100%)':'Mejor: '+P[k]+'%';
function home(){A.innerHTML=`<h1>🍷 Garzón Pro</h1><p class=m>Memoriza las 9 preparaciones de Cocina 2. Repite hasta llegar a 100% en todas.</p>
<div class=tabs><button class="${mode=='o'?'on':''}" onclick="mode='o';home()">Ordenar pasos</button><button class="${mode=='q'?'on':''}" onclick="mode='q';home()">Quiz de datos</button></div>
<div class=grid>${R.map((r,i)=>`<button class=c onclick="go(${i})"><b>${i+1}. ${r.n}</b><span>${st(mode+i)}</span></button>`).join('')}</div>
<button class="b pri" style="margin-top:14px" onclick="mixed()">🎲 Desafío mixto: 10 preguntas al azar</button> <span class=tag>${st('qm')}</span>`}
function go(i){mode=='o'?ord(i):quiz(R[i].q.map(q=>[...q,R[i].n]),'q'+i,R[i].n)}
function ord(i){S={i,ok:0,pool:sh(R[i].s.map((t,k)=>[k,t])),err:0};drawO()}
function drawO(){const{i,ok,pool,err,bad,hint}=S,n=R[i].s.length;
A.innerHTML=`<button class=b onclick=home()>← Menú</button><h2>${R[i].n}</h2><p class=m>Toca los pasos en el orden correcto. Paso ${Math.min(ok+1,n)} de ${n} · Errores: ${err}</p>
<ol>${R[i].s.slice(0,ok).map(t=>`<li>${t}</li>`).join('')}</ol>
${pool.length?pool.map(([k,t])=>`<button class="s ${bad===k?'bad':''} ${hint===k?'hint':''}" onclick=tap(${k})>${t}</button>`).join('')+`<button class=b onclick=hnt()>💡 Pista (cuenta como error)</button>`:fin(Math.round(100*n/(n+err)),err?`Cometiste ${err} error(es). Repite para llegar a 0.`:'¡Orden perfecto!','ord('+i+')')}`}
function tap(k){if(k==S.ok){S.pool=S.pool.filter(p=>p[0]!=k);S.ok++;S.bad=S.hint=null;if(!S.pool.length)put('o'+S.i,Math.round(100*S.ok/(S.ok+S.err)))}else{S.err++;S.bad=k;setTimeout(()=>{S.bad=null},500)}drawO()}
function hnt(){S.err++;S.hint=S.ok;drawO()}
function fin(p,msg,again,extra=''){return`<div class=big>${p}%</div><p>${msg}</p><button class="b pri" onclick="${again}">🔁 Repetir</button>${extra}<button class=b onclick=home()>Menú</button>`}
function mixed(){quiz(sh(R.flatMap(r=>r.q.map(q=>[...q,r.n]))).slice(0,10),'qm','Desafío mixto')}
function quiz(qs,key,t){S={qs:sh(qs),i:0,sc:0,miss:[],key,t,all:qs};drawQ()}
function drawQ(){const{qs,i,t}=S;if(i>=qs.length){const p=Math.round(100*S.sc/qs.length);put(S.key,p);
const re=S.miss.length?`<button class=b onclick="quiz(S.miss,null,'Repaso')">🧠 Repasar falladas (${S.miss.length})</button>`:'';
A.innerHTML=`<h2>${t}</h2>`+fin(p,`${S.sc} de ${qs.length} correctas.`,`quiz(S.all,'${S.key}','${t}')`,re);return}
const q=qs[i];S.o=sh([q[1],...q[2]]);S.a=false;
A.innerHTML=`<button class=b onclick=home()>← Menú</button><p class=tag>${t} · ${i+1}/${qs.length}${q[3]&&S.key=='qm'?' · '+q[3]:''}</p><h2>${q[0]}</h2><div id=ops>${S.o.map((o,j)=>`<button class=o onclick=pick(${j})>${o}</button>`).join('')}</div><div id=nx></div>`}
function pick(j){if(S.a)return;S.a=true;const q=S.qs[S.i],ok=S.o[j]==q[1];ok?S.sc++:S.miss.push(q);
document.querySelectorAll('.o').forEach((b,k)=>{if(S.o[k]==q[1])b.classList.add('good');else if(k==j)b.classList.add('wrong')});
document.getElementById('nx').innerHTML=`<p>${ok?'✅ ¡Correcto!':'❌ Era: <b>'+q[1]+'</b>'}</p><button class="b pri" onclick="S.i++;drawQ()">Siguiente →</button>`}
home();
</script></body></html>
